# 轻量好用的文件管理器(luci-app-quickfile by sbwml)
name: Build 25.12 quickfile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest prerelease info
        id: fetch_release
        run: |
          curl -s https://api.github.com/repos/wkccd/quickfile/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json
      
      - name: Parse asset download URLs
        id: parse_assets
        shell: bash
        run: |
          set -e

          echo "Parsing release assets..."

          # =========================
          # X86
          # =========================
          X86_URL=$(jq -r '
            [.assets[]
             | select(.name | test("^quickfile-.*-x86_64\\.apk$"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_MAIN_X86_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-app-quickfile-.*-x86_64\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_I18N_X86_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-i18n-quickfile-zh-cn-.*-x86_64\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          # =========================
          # ARM (aarch64_cortex-a53)
          # =========================
          ARM_URL=$(jq -r '
            [.assets[]
             | select(.name | test("^quickfile-.*-aarch64_cortex-a53\\.apk$"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_MAIN_ARM_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-app-quickfile-.*-aarch64_cortex-a53\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_I18N_ARM_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-i18n-quickfile-zh-cn-.*-aarch64_cortex-a53\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          # =========================
          # ARM64 GENERIC (新增)
          # =========================
          ARM64_GENERIC_URL=$(jq -r '
            [.assets[]
             | select(.name | test("^quickfile-.*-aarch64_generic\\.apk$"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_MAIN_ARM64_GENERIC_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-app-quickfile-.*-aarch64_generic\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          LUCI_I18N_ARM64_GENERIC_URL=$(jq -r '
            [.assets[]
             | select(.name | test("luci-i18n-quickfile-zh-cn-.*-aarch64_generic\\.apk"))
             | .browser_download_url][0]
          ' release.json)

          echo "DEBUG X86_URL=$X86_URL"
          echo "DEBUG LUCI_MAIN_X86_URL=$LUCI_MAIN_X86_URL"
          echo "DEBUG LUCI_I18N_X86_URL=$LUCI_I18N_X86_URL"
          echo "DEBUG ARM_URL=$ARM_URL"
          echo "DEBUG LUCI_MAIN_ARM_URL=$LUCI_MAIN_ARM_URL"
          echo "DEBUG LUCI_I18N_ARM_URL=$LUCI_I18N_ARM_URL"
          echo "DEBUG ARM64_GENERIC_URL=$ARM64_GENERIC_URL"
          echo "DEBUG LUCI_MAIN_ARM64_GENERIC_URL=$LUCI_MAIN_ARM64_GENERIC_URL"
          echo "DEBUG LUCI_I18N_ARM64_GENERIC_URL=$LUCI_I18N_ARM64_GENERIC_URL"

          # =========================
          # 写入 GITHUB_ENV（安全版）
          # =========================
          [ -n "$X86_URL" ] && echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          [ -n "$LUCI_MAIN_X86_URL" ] && echo "LUCI_MAIN_X86_URL=$LUCI_MAIN_X86_URL" >> $GITHUB_ENV
          [ -n "$LUCI_I18N_X86_URL" ] && echo "LUCI_I18N_X86_URL=$LUCI_I18N_X86_URL" >> $GITHUB_ENV

          [ -n "$ARM_URL" ] && echo "ARM_URL=$ARM_URL" >> $GITHUB_ENV
          [ -n "$LUCI_MAIN_ARM_URL" ] && echo "LUCI_MAIN_ARM_URL=$LUCI_MAIN_ARM_URL" >> $GITHUB_ENV
          [ -n "$LUCI_I18N_ARM_URL" ] && echo "LUCI_I18N_ARM_URL=$LUCI_I18N_ARM_URL" >> $GITHUB_ENV

          [ -n "$ARM64_GENERIC_URL" ] && echo "ARM64_GENERIC_URL=$ARM64_GENERIC_URL" >> $GITHUB_ENV
          [ -n "$LUCI_MAIN_ARM64_GENERIC_URL" ] && echo "LUCI_MAIN_ARM64_GENERIC_URL=$LUCI_MAIN_ARM64_GENERIC_URL" >> $GITHUB_ENV
          [ -n "$LUCI_I18N_ARM64_GENERIC_URL" ] && echo "LUCI_I18N_ARM64_GENERIC_URL=$LUCI_I18N_ARM64_GENERIC_URL" >> $GITHUB_ENV
      
      - name: Download apk files
        run: |
          mkdir -p x86 arm64 arm64-generic
          wget "$X86_URL" -P x86/
          wget "$LUCI_MAIN_X86_URL" -P x86/
          wget "$LUCI_I18N_X86_URL" -P x86/
          
          wget "$ARM_URL" -P arm64/
          wget "$LUCI_MAIN_ARM_URL" -P arm64/
          wget "$LUCI_I18N_ARM_URL" -P arm64/

          wget "$ARM64_GENERIC_URL" -P arm64-generic/
          wget "$LUCI_MAIN_ARM64_GENERIC_URL" -P arm64-generic/
          wget "$LUCI_I18N_ARM64_GENERIC_URL" -P arm64-generic/

          # 从 x86 的 quickfile 文件名提取日期版本号
          file=$(basename "$X86_URL")
          version="${file#*-}"
          version="${version%%-*}"

          echo "VERSION=$version" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Create install.sh scripts
        run: |
          cat <<EOF > x86/install.sh
          #!/bin/sh
          apk update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          apk add bash
          apk add --allow-untrusted *.apk
          # fix nginx
          uci set nginx.global.uci_enable='true'
          uci del nginx._lan
          uci del nginx._redirect2ssl
          uci add nginx server
          uci rename nginx.@server[0]='_lan'
          uci set nginx._lan.server_name='_lan'
          uci add_list nginx._lan.listen='80 default_server'
          uci add_list nginx._lan.listen='[::]:80 default_server'
          uci add_list nginx._lan.include='conf.d/*.locations'
          uci set nginx._lan.access_log='off; # logd openwrt'
          uci commit nginx
          service nginx restart
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh
          cp x86/install.sh arm64-generic/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv arm64-generic makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          ./makeself.sh x86/ 25_quickfile_${VERSION}_x86_64.run "by github action" ./install.sh
          ./makeself.sh arm64/ 25_quickfile_${VERSION}_aarch64_a53.run "by github action" ./install.sh
          ./makeself.sh arm64-generic/ 25_quickfile_${VERSION}_aarch64_generic.run "by github action" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh makeself/25_quickfile_*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV


      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/wkccd/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
              <a href="https://wkdaily.cpolar.cn/archives/1">
                <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
              </a>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
